# Development only: every request is signed in as Andrew Carnegie (ac00), a
# made-up person. proxy_set_header replaces any X-Remote-User the browser sends.
server {
  listen 80;
  location = / { return 302 /grouper/; }
  location /grouper/ {
    proxy_pass http://grouper:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Remote-User ac00;
  }
}
