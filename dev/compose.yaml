# Grouper with the theme, for development: Grouper 7.9.1's UI, Postgres and
# nginx, at http://127.0.0.1:3900/grouper/ (PORT changes the port). Start it
# with make run, which writes dev/data/ first.
name: kith-and-kirr

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: grouper
      POSTGRES_USER: grouper
      POSTGRES_PASSWORD: development-only
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "grouper"]
      interval: 3s
  grouper:
    image: i2incommon/grouper:7.9.1
    command: ui
    depends_on:
      db: { condition: service_healthy }
    environment:
      GROUPER_DATABASE_URL: jdbc:postgresql://db:5432/grouper
      GROUPER_DATABASE_USERNAME: grouper
      GROUPER_DATABASE_PASSWORD: development-only
      GROUPER_AUTO_DDL_UPTOVERSION: v7.*.*
      GROUPER_USE_SSL: "false"
      GROUPER_TOMCAT_HTTP_PORT: "8080"
      GROUPER_SETUP_AUTHN_VALVE: "false"
      GROUPER_RUN_TOMCAT_NOT_SUPERVISOR: "true"
      GROUPER_MAX_MEMORY: 768m
      GROUPER_CHOWN_DIRS: "false"
      # Composite groups get their members from the daemon; a new database
      # starts without the membership cache the check would wait for
      GROUPER_DAEMON: "true"
      GROUPER_WEBCLIENT_IS_SSL: "false"
      GROUPER_CHECK_MEMBERSHIP_CACHE_IS_POPULATED: "false"
    volumes:
      # The theme, as a Grouper admin installs it
      - ../grouper/assets/kith-and-kirr:/opt/grouper/grouperWebapp/grouperExternal/public/assets/kith-and-kirr:ro
      - ../grouper/customHeader.jsp:/opt/grouper/grouperWebapp/WEB-INF/grouperUi2/assetsJsp/customHeader.jsp:ro
      # Grouper's settings files, written by make run from the theme's lines
      - ./data/grouper-ui.properties:/opt/grouper/grouperWebapp/WEB-INF/classes/grouper-ui.properties:ro
      - ./data/grouper.properties:/opt/grouper/grouperWebapp/WEB-INF/classes/grouper.properties:ro
      - ./data/grouper.text.en.us.properties:/opt/grouper/grouperWebapp/WEB-INF/classes/grouperText/grouper.text.en.us.properties:ro
      - ./data/Owasp.CsrfGuard.overlay.properties:/opt/grouper/grouperWebapp/WEB-INF/classes/Owasp.CsrfGuard.overlay.properties:ro
      - ./conf/subject.properties:/opt/grouper/grouperWebapp/WEB-INF/classes/subject.properties:ro
  web:
    image: nginx:1.27-alpine
    depends_on: [grouper]
    ports:
      - "127.0.0.1:${PORT:-3900}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
