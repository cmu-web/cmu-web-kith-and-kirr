# Development settings. dev/load.py adds the settings from demo/groups.yaml
# (the wheel and viewer groups) to the copy in dev/data/.

# New groups grant nothing to everyone; the demo's folders say who sees what
groups.create.grant.all.read = false
groups.create.grant.all.view = false

# Composite groups get their members as each change is made, instead of from
# the daemon: a GSH script that exits right after making a composite can
# leave it empty for good (issue #2)
composites.synchronousCalculationGroupNameRegex = .*
