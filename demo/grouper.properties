# The public demo's Grouper settings, added after demo/groups.yaml's settings
# (which dev/load.py writes).
#
# Read-only: every change through the UI, web services or GSH fails with
# GrouperReadonlyException, even for Grouper's own system account. Browsing
# writes nothing. Load demo/groups.yaml with this line out, then add it and
# restart Grouper.
grouper.api.readonly = true

# New groups grant nothing to everyone; the demo's folders say who sees what
groups.create.grant.all.read = false
groups.create.grant.all.view = false
