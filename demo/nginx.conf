# The public demo's web server, in front of Grouper. Every visitor is signed
# in as Andrew Carnegie (ac00), a made-up person in demo/groups.yaml's viewer
# group (app:grouper:viewer), who can see every folder, group and member and
# change nothing. proxy_set_header replaces any X-Remote-User a browser sends.
# Grouper itself gets no outbound network access; only this server reaches it.
server {
  listen 80;
  location = / { return 302 /grouper/; }
  location /grouper/ {
    proxy_pass http://grouper:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Remote-User ac00;
  }
}
