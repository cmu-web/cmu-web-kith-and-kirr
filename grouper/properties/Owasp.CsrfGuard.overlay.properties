# Kith & Kirr's line for Grouper's CSRFGuard: add it to Grouper's
# WEB-INF/classes/Owasp.CsrfGuard.overlay.properties, keeping the settings
# Grouper ships there.
#
# Static files keep their addresses after a page loads. Without this line,
# CSRFGuard appends its token to every stylesheet's address once the page
# has loaded, so the browser drops each stylesheet and downloads it again,
# and pages paint without the theme in between. The server checks tokens as
# before; only static files stop getting one.
org.owasp.csrfguard.JavascriptServlet.UnprotectedExtensions = js,css,gif,png,ico,jpg,svg,woff2
