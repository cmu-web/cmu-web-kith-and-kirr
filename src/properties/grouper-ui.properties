# Kith & Kirr's settings for Grouper's UI: add these lines to Grouper's
# WEB-INF/classes/grouper-ui.properties.

# The Web Kilt's styles and the theme's, after Grouper's own
css.additional = ../../grouperExternal/public/assets/kith-and-kirr/cmu-cms.css ../../grouperExternal/public/assets/kith-and-kirr/kith-and-kirr.css

# The CMU wordmark in the red bar
image.organisation-logo = grouperExternal/public/assets/kith-and-kirr/cmu-wordmark-white.png

# The side panel stays open; the theme has no control to hide it
uiV2.disable.hide-show.side.panel = true

# No Sign Out link: behind single sign-on, Grouper's sign-out ends only
# Grouper's own session, and the next page signs the user back in
logout.link.show = false
